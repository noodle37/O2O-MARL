# Problem-validation experiment 1 base config (2halfcheetah, Medium).
#
# Same five arms and the same single-factor protocol as
# configs/pv_base_5m_vs_6m.yaml; the driver (scripts/run_pv_exp1.sh) changes only
# the per-arm switches:
#   A  direct fine-tune      plain TD, nothing retained
#   B  continual conservative plain TD + online CQL term (constraint retained)
#   C  OVMSE                  offline value memory (whole net retained)
#   D  scale correction       arm A recipe from an affine-rescaled checkpoint
#   Z  from scratch           no offline weights at all (protocol check)
#
# Budget scaling (this map is continuous, 2 agents, 1000-step episodes):
#   * t_max is 1M environment steps, the same budget the design states for every
#     map.  t_env advances 2,000 steps per rollout (batch_size_run 2 x 1000), and
#     the replay buffer needs 128 episodes (64 rollouts, 128k steps) before the
#     first gradient step, so 1M steps is ~440 gradient updates against ~4,600 on
#     5m_vs_6m.  Cross-map comparisons of *when* something happens are therefore
#     indicative only; the arms within this map remain strictly comparable.
#   * Schedule constants keep the same fraction of the budget as the 5m config:
#     lambda_anneal_steps 200k (20%), eps decay 100k (10%), dense early
#     evaluation up to 250k then every 125k.
#   * target_update_interval 50 episodes = 25 rollouts, matching 5m's 200
#     episodes / 8 envs in gradient-update terms (the convention already used by
#     configs/2halfcheetah.yaml).
#   * Periodic checkpoints every 25k steps give arm A the t in
#     {25k,50k,100k,250k,500k,1M} snapshots experiment 2a needs.
#   * There is no win rate on this map, so the exp1 metrics switch to the mean
#     episode return (pv/exp1_metrics.py picks the metric from the log fields).
system_name: "pv exp1 2halfcheetah"
seed: 1
wandb_project: og-marl
phase: online
t_max: 1000000
buffer_size: 5000
batch_size: 128
batch_size_run: 2
test_interval: 125000
eval_interval_early: 25000
eval_interval_late: 125000
eval_switch_t: 250000
num_eval_episodes: 32
save_best_checkpoint: false
checkpoint_dir: checkpoints/pv_exp1/2halfcheetah/placeholder
checkpoint_path: checkpoints/pv_exp1_offline/2halfcheetah_medium/ovmse_paper_seed1.pt
log_path: checkpoints/pv_exp1/2halfcheetah/placeholder/online.jsonl

task:
  source: og_marl
  env: mamujoco
  scenario: 2halfcheetah
  dataset: Medium

system:
  learning_rate: 0.001
  linear_layer_dim: 64
  recurrent_layer_dim: 64
  mixer_embed_dim: 32
  mixer_hyper_dim: 64
  discount: 0.99
  td_lambda: 0.6
  grad_norm_clip: 10.0
  target_update_interval: 50
  add_agent_id_to_obs: true
  raw_cql: false
  moderate_lambda: true
  cql_weight: 0.0
  online_cql_weight: 0.0
  num_ood_actions: 100
  softmax_temp: 5
  max_behaviour_filled_steps: 12800000
  mixing_ratio: 0.0
  lambda_memory_end: 0.1
  lambda_anneal_steps: 200000
  use_ovm: false
  sequential_explore: true
  ovm_diag_train_stats: true
  ovm_diag_stride: 4
  eps_start: 1.0
  eps_min: 0.05
  eps_decay_steps: 100000
  device: cuda
  data_device: cpu

online:
  t_max: 1000000
  test_interval: 125000
  use_ovm: false

transfer:
  mode: full_td

ovm_diag:
  ckpt_every: 25000

# Fixed evaluation seed: a dedicated env used only for evaluation, so every arm is
# scored on exactly the same episodes at the same t_env.
eval_env_seed: 424242

# Behaviour-prior cache for the continual-conservative arm (B).  Filled by the
# offline pretraining run, so the online arm loads it instead of retraining.
behaviour_cache_dir: checkpoints/pv_exp1_offline/2halfcheetah_medium/behaviour

# Experiment 2b: per-state records logged while arm C trains.
pv_probe:
  enabled: true
  every: 10000
  episodes: 20
  behaviour_ckpt: checkpoints/pv_behaviour/2halfcheetah/model.pt
  ensemble_dir: checkpoints/pv_behaviour/2halfcheetah
  thresholds: checkpoints/pv_behaviour/2halfcheetah/thresholds.json
  out: checkpoints/pv_exp1/2halfcheetah/placeholder/probe.jsonl
