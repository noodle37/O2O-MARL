# Sim2O (arXiv:2606.21085) on SMAC 5m_vs_6m, matched to the local O2O protocol.
# Offline: OMIGA (V/Q/policy) for 10M filled transitions on the Medium vault dataset.
# Online: 3M env steps, 8 parallel envs, CBS joint-action composition, rho=0.5 replay mix.
system_name: "sim2o 5m_vs_6m"
learner_type: sim2o
seed: 1
wandb_project: og-marl
phase: offline
t_max: 10000000
buffer_size: 5000
batch_size: 128
batch_size_run: 8
test_interval: 10000
num_eval_episodes: 32
save_best_checkpoint: true
checkpoint_dir: checkpoints/sim2o_5m_vs_6m_seed1
checkpoint_path: checkpoints/sim2o_5m_vs_6m_seed1/sim2o_seed1_best.pt

task:
  source: cfcql
  env: smac_v1
  scenario: 5m_vs_6m
  dataset: Medium

system:
  learning_rate: 0.0005
  recurrent_layer_dim: 256
  mixer_hyper_dim: 64
  discount: 0.99
  grad_norm_clip: 10.0
  target_update_interval: 200
  add_agent_id_to_obs: true
  cql_weight: 0.0
  online_cql_weight: 0.0
  mixing_ratio: 0.5
  lambda_memory_end: 1.0
  lambda_anneal_steps: 0
  use_ovm: false
  eps_start: 1.0
  eps_min: 0.05
  eps_decay_steps: 100000
  device: cuda
  data_device: cpu

# Sim2O paper Table IX (online stage). alpha and temperature are value-scale
# temperatures: alpha divides the advantage in Eqs. 7-9 and tau divides Q_tot in
# Eq. 5. The paper's alpha=10, tau=5 target MA-MuJoCo, whose returns and advantages
# are roughly an order of magnitude larger than SMAC's (5m_vs_6m team return ~15,
# advantage O(1)); left as-is, exp(advantage/alpha) stays within [0.95, 1.41] and
# the beam softmax is uniform. Both are rescaled by 1/10, equivalent to training
# on rewards scaled by 10, so advantage weighting and CBS pruning discriminate.
sim2o:
  alpha: 1.0
  beam_width: 5
  temperature: 0.5
  target_tau: 0.005
  eval_greedy: true
  random_agent_order: true

online:
  t_max: 3000000
  test_interval: 10000

transfer:
  mode: none
