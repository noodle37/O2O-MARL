# FHJP (Finite Handover of Joint Proposals) on 5m_vs_6m, online phase only.
#
# Same starting point as OVMSE / UOT on this map: the shared offline checkpoint
#   checkpoints/ovmse_batch_20261014/5m_vs_6m_offline/ovmse_paper_seed1_best.pt
# (identical file the seed-replication launcher uses). Only the online seed
# changes across the three seeds.
#
# Same online protocol as the OVMSE-paper / UOT 5m_vs_6m arms
# (configs/5m_vs_6m.yaml, configs/uot_5m_vs_6m.yaml) with every offline-specific
# term switched off, because the algorithm spec
# (documentation/joint_proposal_handover.md) requires plain online QMIX TD:
#   cql_weight = 0, online_cql_weight = 0, mixing_ratio = 0, use_ovm = false.
# The joint proposer adds no loss term, no propensity and no offline replay.
#
# Spec: documentation/joint_proposal_handover.md
system_name: "fhjp 5m_vs_6m"
seed: 1
wandb_project: og-marl
phase: online
t_max: 3000000
buffer_size: 5000
batch_size: 128
batch_size_run: 8
test_interval: 10000
num_eval_episodes: 32
save_best_checkpoint: false
checkpoint_dir: checkpoints/fhjp_5m_vs_6m/seed1
checkpoint_path: checkpoints/ovmse_batch_20261014/5m_vs_6m_offline/ovmse_paper_seed1_best.pt
log_path: checkpoints/fhjp_5m_vs_6m/seed1/online.jsonl

task:
  source: cfcql
  env: smac_v1
  scenario: 5m_vs_6m
  dataset: Medium

system:
  learning_rate: 0.001
  linear_layer_dim: 64
  recurrent_layer_dim: 64
  mixer_embed_dim: 32
  mixer_hyper_dim: 64
  discount: 0.99
  td_lambda: 0.6
  target_update_interval: 200
  grad_norm_clip: 10.0
  add_agent_id_to_obs: true
  raw_cql: false
  moderate_lambda: true
  cql_weight: 0.0
  online_cql_weight: 0.0
  num_ood_actions: 100
  max_behaviour_filled_steps: 500000
  mixing_ratio: 0.0
  use_ovm: false
  eps_start: 1.0
  eps_min: 0.05
  eps_decay_steps: 100000
  device: cuda
  data_device: cpu

online:
  t_max: 3000000
  test_interval: 10000
  use_ovm: false

transfer:
  mode: full_td

# FHJP block. p is fixed by the randomised comparison protocol, not learned.
# version_len / eval_episodes_per_arm / min_eval_episodes / alpha are
# implementation parameters the spec deliberately leaves open (doc section 9):
# version_len is a small fraction of the 3M online budget so six version
# boundaries actually occur, and each boundary costs 2 * eval_episodes_per_arm
# environment episodes, which count towards the interaction budget.
proposer:
  enabled: true
  p: 0.5
  version_len: 500000
  eval_episodes_per_arm: 32
  min_eval_episodes: 16
  alpha: 0.05
  eval_seed_base: 900001
  count_eval_in_budget: true
