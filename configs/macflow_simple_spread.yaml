# MAC-Flow offline on MPE simple_spread (continuous, Omar vault).
learner_type: mac_flow
system_name: "mac_flow simple_spread"
seed: 1
wandb_project: og-marl
phase: offline
count_updates: true
t_max: 500000
batch_size: 64
batch_size_run: 2
test_interval: 50000
num_eval_episodes: 10
save_best_checkpoint: true
checkpoint_dir: checkpoints/macflow_simple_spread
checkpoint_path: checkpoints/macflow_simple_spread/mac_flow_seed1_best.pt
log_path: checkpoints/macflow_simple_spread/offline.jsonl

task:
  source: omar
  env: mpe
  scenario: simple_spread
  dataset: Medium
  action_mode: continuous

system:
  learning_rate: 0.0003
  discount: 0.995
  alpha_distill: 3.0
  flow_steps: 10
  polyak_tau: 0.005
  grad_norm_clip: 10.0
  normalize_q: true
  device: cpu

online:
  t_max: 500000
  test_interval: 50000
  log_path: checkpoints/macflow_simple_spread/online.jsonl

transfer:
  mode: mac_flow
