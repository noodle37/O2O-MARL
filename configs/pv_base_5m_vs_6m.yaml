# Problem-validation experiment 1 base config (5m_vs_6m, medium).
#
# Shared by all five arms; the driver (scripts/run_pv_exp1.sh) changes only the
# per-arm switches, so every arm starts from the same offline checkpoint
# (ovmse_paper_seed1_best), uses the same online recipe, the same sequential
# exploration, the same fixed evaluation seeds, and the same 1M-step budget.
# The only difference between arms is what is retained from the offline model:
#   A  direct fine-tune      plain TD, nothing retained
#   B  continual conservative plain TD + online CQL term (constraint retained)
#   C  OVMSE                  offline value memory (whole net retained)
#   D  scale correction       arm A recipe from an affine-rescaled checkpoint
#   Z  from scratch           no offline weights at all (protocol check)
#
# Evaluation cadence follows the design: every 5k steps up to 200k, then every
# 20k; 32 episodes per point; periodic checkpoints every 25k steps so arm A has
# the t in {25k,50k,100k,250k,500k,1M} snapshots experiment 2a needs (t=0 is the
# offline checkpoint itself).
system_name: "pv exp1 5m_vs_6m"
seed: 1
wandb_project: og-marl
phase: online
t_max: 1000000
buffer_size: 5000
batch_size: 128
batch_size_run: 8
test_interval: 20000
eval_interval_early: 5000
eval_interval_late: 20000
eval_switch_t: 200000
num_eval_episodes: 32
save_best_checkpoint: false
checkpoint_dir: checkpoints/pv_exp1/placeholder
checkpoint_path: checkpoints/ovmse_batch_20261014/5m_vs_6m_offline/ovmse_paper_seed1_best.pt
log_path: checkpoints/pv_exp1/placeholder/online.jsonl

task:
  source: cfcql
  env: smac_v1
  scenario: 5m_vs_6m
  dataset: Medium

system:
  learning_rate: 0.001
  linear_layer_dim: 64
  recurrent_layer_dim: 64
  mixer_embed_dim: 32
  mixer_hyper_dim: 64
  discount: 0.99
  td_lambda: 0.6
  grad_norm_clip: 10.0
  target_update_interval: 200
  add_agent_id_to_obs: true
  raw_cql: false
  moderate_lambda: true
  cql_weight: 0.0
  online_cql_weight: 0.0
  num_ood_actions: 100
  softmax_temp: 0.5
  max_behaviour_filled_steps: 500000
  mixing_ratio: 0.0
  lambda_memory_end: 0.1
  lambda_anneal_steps: 200000
  use_ovm: false
  sequential_explore: true
  ovm_diag_train_stats: true
  ovm_diag_stride: 4
  eps_start: 1.0
  eps_min: 0.05
  eps_decay_steps: 100000
  device: cuda
  data_device: cpu

online:
  t_max: 1000000
  test_interval: 20000
  use_ovm: false

transfer:
  mode: full_td

ovm_diag:
  ckpt_every: 25000

# Fixed evaluation seed: a dedicated env used only for evaluation, so every arm is
# scored on exactly the same episodes at the same t_env.
eval_env_seed: 424242

# Behaviour-prior cache for the continual-conservative arm (B), produced by the
# offline pretraining run; the online arm loads it instead of retraining.
behaviour_cache_dir: checkpoints/ovmse_batch_20261014/5m_vs_6m_offline/behaviour

# Experiment 2b: per-state records logged while arm C trains.
pv_probe:
  enabled: true
  every: 10000
  episodes: 20
  behaviour_ckpt: checkpoints/pv_behaviour/5m_vs_6m/model.pt
  ensemble_dir: checkpoints/pv_behaviour/5m_vs_6m
  thresholds: checkpoints/pv_behaviour/5m_vs_6m/thresholds.json
  out: checkpoints/pv_exp1/5m_vs_6m/placeholder/probe.jsonl
