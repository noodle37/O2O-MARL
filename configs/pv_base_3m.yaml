# One-sided policy-shift evaluation base config (3m, OG-MARL core Medium).
system_name: "pv shift 3m"
seed: 1
wandb_project: og-marl
phase: online
t_max: 1000000
buffer_size: 5000
batch_size: 128
batch_size_run: 8
test_interval: 20000
eval_interval_early: 5000
eval_interval_late: 20000
eval_switch_t: 200000
num_eval_episodes: 32
save_best_checkpoint: false
checkpoint_dir: checkpoints/one_sided_shift/3m/placeholder
checkpoint_path: checkpoints/ovmse_paper_3m/ovmse_paper_seed1_best.pt
log_path: checkpoints/one_sided_shift/3m/placeholder/online.jsonl

task:
  source: og_marl
  env: smac_v1
  scenario: 3m
  dataset: Medium

system:
  learning_rate: 0.001
  linear_layer_dim: 64
  recurrent_layer_dim: 64
  mixer_embed_dim: 32
  mixer_hyper_dim: 64
  discount: 0.99
  td_lambda: 0.6
  grad_norm_clip: 10.0
  target_update_interval: 200
  add_agent_id_to_obs: true
  raw_cql: false
  moderate_lambda: true
  cql_weight: 0.0
  online_cql_weight: 0.0
  num_ood_actions: 100
  softmax_temp: 0.5
  max_behaviour_filled_steps: 500000
  mixing_ratio: 0.0
  lambda_memory_end: 0.1
  lambda_anneal_steps: 200000
  use_ovm: false
  sequential_explore: true
  ovm_diag_train_stats: true
  ovm_diag_stride: 4
  eps_start: 1.0
  eps_min: 0.05
  eps_decay_steps: 100000
  device: cuda
  data_device: cpu

online:
  t_max: 1000000
  test_interval: 20000
  use_ovm: false

transfer:
  mode: full_td

# Fixed evaluation seed: same episodes for every condition.
eval_env_seed: 424242

behaviour_cache_dir: checkpoints/ovmse_paper_3m/behaviour

pv_probe:
  enabled: false
