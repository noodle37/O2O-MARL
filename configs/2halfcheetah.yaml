# OVMSE transfer study — continuous 2halfcheetah (og_marl, discrete 27-way torque bins)
#
# Budget scaling: an episode here is the full 1000-step limit, so one batch of
# 128 episodes carries 128,000 filled steps versus 3,463 on 5m_vs_6m and 6,854
# on 2s3z. Every constant that is consumed in *env steps* or *episodes* is
# therefore rescaled so this map gets the same number of gradient updates,
# behaviour-cloning steps, target refreshes and annealing fractions as the SMAC
# reference runs (5m_vs_6m: 2,888 updates / 144 BC steps / target every 25).
#   t_max                     3,000 updates x 128,000          = 3.84e8
#   test_interval             every 100 updates -> 30 evals     = 1.28e7
#   max_behaviour_filled_steps  100 BC steps x 128,000          = 1.28e7
#   lambda_anneal_steps       60 updates (~2% of budget)        = 7.68e6
#   target_update_interval    25 gradient steps x batch_size_run 2 = 50
system_name: "ovmse_paper 2halfcheetah"
seed: 1
wandb_project: og-marl
phase: offline
t_max: 384000000
buffer_size: 5000
batch_size: 128
batch_size_run: 2
test_interval: 12800000
num_eval_episodes: 32
save_best_checkpoint: true
# Offline pretraining weights live in their own directory so the online phase
# cannot overwrite them; run_ovmse_macal_2halfcheetah.sh points the online run
# at a sibling directory and reads the offline best via checkpoint_path.
checkpoint_dir: checkpoints/ovmse_2halfcheetah_offline
behaviour_cache_dir: checkpoints/ovmse_2halfcheetah_offline/behaviour
checkpoint_path: checkpoints/ovmse_2halfcheetah_offline/ovmse_paper_seed1_best.pt
log_path: checkpoints/ovmse_2halfcheetah_offline/offline.jsonl

task:
  source: og_marl
  env: mamujoco
  scenario: 2halfcheetah
  dataset: Good

system:
  learning_rate: 0.001
  linear_layer_dim: 64
  recurrent_layer_dim: 64
  mixer_embed_dim: 32
  mixer_hyper_dim: 64
  discount: 0.99
  td_lambda: 0.6
  target_update_interval: 50
  grad_norm_clip: 10.0
  add_agent_id_to_obs: true
  raw_cql: false
  moderate_lambda: true
  cql_weight: 50.0
  softmax_temp: 5
  num_ood_actions: 100
  max_behaviour_filled_steps: 12800000
  online_cql_weight: 0.0
  mixing_ratio: 0.1
  lambda_memory_end: 0.1
  lambda_anneal_steps: 7680000
  use_ovm: false
  eps_start: 1.0
  eps_min: 0.05
  eps_decay_steps: 100000
  device: cuda

online:
  t_max: 3000000
  # Online t_env advances 2,000 steps per rollout (batch_size_run 2 x 1000), so
  # 1e5 gives ~30 evaluations across the 3e6-step fine-tune.
  test_interval: 100000
  use_ovm: true
  log_path: checkpoints/ovmse_2halfcheetah_online/online.jsonl

transfer:
  mode: ovmse
